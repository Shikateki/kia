<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surat untukmu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#f3dde0; --bg2:#e2b9c4; --ink:#3a1f2b; --muted:#7a5460;
  --paper:#fffaf6; --line:#ecd9d6; --handwrite:#4a2a3a;
  --seal:#8c1d3b; --seal-hi:#b93557; --env:#d9a3b0; --env-in:#c48898; --panel:#fffaf6cc;
  --serif:'Fraunces',Georgia,serif; --hand:'Caveat','Segoe Script',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#1e1330; --bg2:#3a1d3f; --ink:#f6e6ea; --muted:#c9a7b5;
    --paper:#f8efe8; --line:#e6d3cd; --handwrite:#3f2433;
    --env:#8a5a78; --env-in:#6e4560; --panel:#2a1a38cc;
  }
}
:root[data-theme="dark"]{
  --bg1:#1e1330; --bg2:#3a1d3f; --ink:#f6e6ea; --muted:#c9a7b5;
  --paper:#f8efe8; --line:#e6d3cd; --handwrite:#3f2433;
  --env:#8a5a78; --env-in:#6e4560; --panel:#2a1a38cc;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1);color:var(--ink);font-family:var(--serif);display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:560px;padding:28px 20px 40px;display:flex;flex-direction:column;align-items:center}
h1{font-weight:500;font-size:clamp(1.5rem,6vw,2rem);margin:12px 0 4px;text-align:center}
.sub{color:var(--muted);margin:0 0 28px;text-align:center;font-style:italic}

/* envelope */
.scene{perspective:900px;transition:transform .8s ease,opacity .6s ease .2s}
.scene.gone{transform:translateY(60px) scale(.96);opacity:0;pointer-events:none;position:absolute;visibility:hidden;transition:none}
.scene.leaving{transform:translateY(40px);opacity:0}
.envelope{position:relative;width:min(320px,82vw);aspect-ratio:3/2;background:var(--env);border-radius:6px;box-shadow:0 18px 40px #0000003a}
.envelope::before{content:"";position:absolute;inset:0;border-radius:6px;background:var(--env-in);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:var(--env-in);filter:brightness(1.08);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:2}
.opened .flap{transform:rotateX(180deg)}
.to{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-family:var(--hand);font-size:1.5rem;color:var(--ink);opacity:.85;z-index:1}
.seal{position:absolute;left:50%;top:60%;width:62px;height:62px;margin:-31px 0 0 -31px;border:0;border-radius:50%;z-index:3;cursor:pointer;color:#fde7ec;font-size:1.6rem;
  background:radial-gradient(circle at 35% 30%,var(--seal-hi),var(--seal));box-shadow:0 4px 10px #0000004d,inset 0 0 0 4px #ffffff22;animation:beat 1.8s ease-in-out infinite}
.seal:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffb3c6;outline-offset:3px}
.opened .seal{animation:none;transform:scale(0);transition:transform .3s}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.hint{margin-top:22px;color:var(--muted);text-align:center}

/* letter */
.letter{display:none;width:100%}
.letter.show{display:block}
.paper{background:var(--paper);color:var(--handwrite);border-radius:4px;padding:34px 26px 30px;box-shadow:0 20px 50px #00000040;
  background-image:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);background-position:0 30px}
.paper p{font-family:var(--hand);font-size:clamp(1.35rem,5.2vw,1.65rem);line-height:36px;margin:0 0 36px;max-width:60ch}
.paper .hi{font-weight:700;font-size:clamp(1.6rem,6vw,2rem)}
.paper .sign{text-align:right;margin:8px 0 0}
.paper .sign::after{content:" ♥";color:var(--seal)}
.line{opacity:0;transform:translateY(8px)}
.show .line{animation:in .9s ease forwards;animation-delay:calc(var(--i)*.55s + .2s)}
@keyframes in{to{opacity:1;transform:none}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
button.btn{font:inherit;font-size:1rem;padding:11px 20px;border-radius:999px;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
button.btn.main{background:var(--seal);border-color:var(--seal);color:#fff}

/* editor */
.editor{display:none;width:100%;margin-top:22px;background:var(--panel);border-radius:14px;padding:18px;backdrop-filter:blur(8px)}
.editor.show{display:block}
label{display:block;font-size:.95rem;margin:12px 0 5px}
input,textarea{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:8px;border:1px solid var(--muted);background:var(--paper);color:#3a1f2b}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.editor .btn{margin-top:14px}
.note{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.days{text-align:center;margin:22px 0 0;font-size:1.15rem;display:none}
.days b{font-family:var(--hand);font-size:2.4rem;font-weight:700;color:var(--seal-hi);display:block;line-height:1.1}
.photos{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:22px}
.photos figure{margin:0;background:var(--paper);padding:8px 8px 26px;box-shadow:0 8px 20px #0000003a;width:min(150px,42vw);transform:rotate(var(--r))}
.photos img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{display:inline-block;margin:0;font:inherit;font-size:1rem;padding:11px 20px;border-radius:999px;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.btn[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:#fff}
.surprise{text-align:center;margin-top:28px}
.ps{font-family:var(--hand);font-size:1.5rem;line-height:1.4;margin:16px auto 0;max-width:30ch;opacity:0;transition:opacity 1.2s ease}
.ps.show{opacity:1}
.heart{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){
  .heart{display:none}
  .seal{animation:none}
  .show .line{animation:none;opacity:1;transform:none}
  .flap,.scene{transition:none}
}
</style>
</head>
<body>
<main>
  <h1 id="title">Ada surat untukmu</h1>
  <p class="sub" id="sub">Ditulis dengan hati-hati, disegel dengan sayang.</p>

  <div class="scene" id="scene">
    <div class="envelope" id="env">
      <div class="flap"></div>
      <div class="to" id="envTo"></div>
      <button class="seal" id="seal" aria-label="Buka surat">♥</button>
    </div>
    <p class="hint">Ketuk segel untuk membuka</p>
  </div>

  <section class="letter" id="letter" aria-live="polite">
    <div class="paper" id="paper"></div>
    <div class="days" id="days"></div>
    <div class="photos" id="photos"></div>
    <div class="surprise">
      <button class="btn main" id="hugBtn">Peluk</button>
      <p class="ps" id="ps"></p>
    </div>
    <div class="actions">
      <button class="btn main" id="editBtn">Tulis suratmu sendiri</button>
      <button class="btn" id="replayBtn">Baca ulang</button>
      <button class="btn" id="musicBtn" aria-pressed="false">Putar musik</button>
      <label class="btn" id="photoBtn" for="photoIn" tabindex="0">Tambah foto</label>
      <input type="file" class="sr" id="photoIn" accept="image/*" multiple>
      <button class="btn" id="themeBtn">Ganti tema</button>
    </div>
  </section>

  <section class="editor" id="editor">
    <label for="fTo">Untuk siapa</label>
    <input id="fTo" maxlength="40">
    <label for="fFrom">Dari</label>
    <input id="fFrom" maxlength="40">
    <label for="fBody">Isi surat</label>
    <textarea id="fBody"></textarea>
    <p class="note">Pisahkan paragraf dengan baris kosong.</p>
    <label for="fDate">Tanggal jadian / hari spesial (opsional)</label>
    <input id="fDate" type="date">
    <button class="btn main" id="applyBtn">Perbarui surat</button>
  </section>
</main>

<script>
var data = {
  to: "Rem",
  from: "Radiant",
  body: "Aku tidak pandai merangkai kata, jadi aku tulis saja apa adanya.\n\nKamu itu lucu, imut, dan manjanya bikin aku nggak bisa berhenti senyum. Lewat hal-hal kecil yang kamu lakukan, aku selalu merasa dicari dan dibutuhkan.\n\nTerima kasih sudah setia dan selalu ada di sampingku. Semua kenangan kita yang selalu bersama itu adalah hal yang paling ingin aku jaga.\n\nDan yang paling aku syukuri: kamu menerima aku apa adanya, bahkan di sisi yang aku sendiri belum tentu bisa terima. Karena itu aku sayang kamu, Rem. Hari ini, besok, dan seterusnya."
};
var $ = function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function render(){
  var paras = data.body.split(/\n\s*\n/).filter(function(p){return p.trim()});
  var html = '<p class="hi line" style="--i:0">Untuk ' + esc(data.to) + ',</p>';
  paras.forEach(function(p,i){
    html += '<p class="line" style="--i:' + (i+1) + '">' + esc(p.trim()).replace(/\n/g,'<br>') + '</p>';
  });
  html += '<p class="sign line" style="--i:' + (paras.length+1) + '">' + esc(data.from) + '</p>';
  $('paper').innerHTML = html;
  $('envTo').textContent = 'Untuk ' + data.to;
  $('title').textContent = 'Ada surat untuk ' + data.to;
  $('hugBtn').textContent = 'Peluk ' + data.to;
  $('ps').classList.remove('show');
  $('ps').textContent = '';
  renderExtras();
}

function openLetter(){
  try { $('musicBtn').click() } catch (e) {}
  $('env').classList.add('opened');
  setTimeout(function(){ $('scene').classList.add('leaving') }, 750);
  setTimeout(function(){
    $('scene').classList.add('gone');
    $('letter').classList.add('show');
    $('letter').scrollIntoView({block:'start'});
  }, 1350);
}
function replay(){
  $('letter').classList.remove('show');
  void $('letter').offsetWidth;
  render();
  $('letter').classList.add('show');
}

$('seal').addEventListener('click', openLetter);
$('replayBtn').addEventListener('click', replay);
$('editBtn').addEventListener('click', function(){
  $('fTo').value = data.to; $('fDate').value = data.date || ''; $('fFrom').value = data.from; $('fBody').value = data.body;
  $('editor').classList.toggle('show');
  if ($('editor').classList.contains('show')) $('editor').scrollIntoView({behavior:'smooth'});
});
$('applyBtn').addEventListener('click', function(){
  data.to = $('fTo').value.trim() || 'Kamu';
  data.from = $('fFrom').value.trim() || 'Aku';
  data.body = $('fBody').value.trim() || data.body;
  data.date = $('fDate').value;
  $('editor').classList.remove('show');
  replay();
  $('letter').scrollIntoView({behavior:'smooth'});
});
$('themeBtn').addEventListener('click', function(){
  var r = document.documentElement;
  var dark = r.getAttribute('data-theme') === 'dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
});
function hearts(){
  var c = ['#e2506f','#ff8fa8','#b93557','#ffc2d1'];
  for (var i = 0; i < 36; i++){
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '\u2665';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    h.style.color = c[i % c.length];
    h.style.animationDuration = (3 + Math.random() * 3) + 's';
    h.style.animationDelay = (Math.random() * 1.2) + 's';
    document.body.appendChild(h);
    setTimeout((function(el){ return function(){ el.remove() } })(h), 7000);
  }
}
$('hugBtn').addEventListener('click', function(){
  hearts();
  var ps = $('ps');
  ps.textContent = 'P.S. Kalau kamu senyum pas baca ini, berarti suratnya berhasil. Peluk balik ya, ' + data.to + ' \u2665';
  setTimeout(function(){ ps.classList.add('show') }, 900);
  ps.scrollIntoView({behavior:'smooth', block:'center'});
});
var photos = [];
function renderExtras(){
  var d = $('days');
  if (data.date){
    var t = new Date(data.date + 'T00:00:00'), n = new Date(); n.setHours(0,0,0,0);
    var diff = Math.round((n - t) / 864e5);
    d.innerHTML = diff >= 0 ? '<b>' + diff + ' hari</b>kita sudah bersama' : '<b>' + (-diff) + ' hari lagi</b>menuju hari spesial kita';
    d.style.display = 'block';
  } else d.style.display = 'none';
  $('photos').innerHTML = photos.map(function(src,i){
    return '<figure style="--r:' + ((i%2?1:-1)*(2+i%3)) + 'deg"><img alt="Foto kenangan" src="' + src + '"></figure>';
  }).join('');
}
$('photoIn').addEventListener('change', function(e){
  Array.prototype.forEach.call(e.target.files, function(f){
    var r = new FileReader();
    r.onload = function(){ photos.push(r.result); renderExtras() };
    r.readAsDataURL(f);
  });
  e.target.value = '';
});

/* musik lembut dari WebAudio, tanpa file luar */
var ac, timer, step = 0;
var notes = [261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];
function tone(freq){
  var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 1.7);
}
$('musicBtn').addEventListener('click', function(){
  var on = this.getAttribute('aria-pressed') === 'true';
  if (on && song) song.pause();
  if (!on && song){
    song.play().catch(function(){});
    this.setAttribute('aria-pressed','true'); this.textContent = 'Hentikan musik';
    return;
  }
  if (on){ clearInterval(timer); this.setAttribute('aria-pressed','false'); this.textContent = 'Putar musik'; return; }
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    timer = setInterval(function(){ tone(notes[step++ % notes.length]) }, 700);
    this.setAttribute('aria-pressed','true'); this.textContent = 'Hentikan musik';
  } catch (err) { this.textContent = 'Musik tidak didukung'; }
